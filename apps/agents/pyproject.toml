[project]
name = "agents-app"
version = "0.1.0"
description = "FastAPI LangChain/LangGraph agent service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "menuyukti",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.40.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "python-dotenv>=1.2.1",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langchain-tavily>=0.2.18",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agents_app",
    "agents_app.agents",
    "agents_app.agents.core",
    "agents_app.agents.core.chat",
    "agents_app.agents.core.format_markdown",
    "agents_app.agents.core.milestone_data",
    "agents_app.agents.core.milestone_eval",
    "agents_app.models",
    "agents_app.routers",
]

[tool.setuptools.package-dir]
"agents_app" = "."

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = [
    "^tests/",
]

[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "langchain_openai.*", "langgraph.*", "langchain_tavily.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
