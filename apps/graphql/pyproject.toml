[project]
name = "graphql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.46",
    "strawberry-graphql[asgi]>=0.308.2",
    "uvicorn>=0.40.0",
    "psycopg2-binary>=2.9.5,<3.0",
    "python-dotenv>=1.2.1",
    "openpyxl>=3.1.2",
    "pytest>=9.0.0",
    "menuyukti",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "apps.graphql",
    "apps.graphql.schema",
    "apps.graphql.resolvers",
    "apps.graphql.data_sources",
]

[tool.setuptools.package-dir]
"apps.graphql" = "."
"apps.graphql.schema" = "schema"
"apps.graphql.resolvers" = "resolvers"
"apps.graphql.data_sources" = "data_sources"
