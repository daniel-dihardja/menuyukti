  deleteNode(id: ID!): Boolean!
  deletePost(id: ID!): Boolean!
  deletePostPage(pageId: ID!): Boolean!
  deletePostPageMediaVersion(pageId: ID!, mediaS3Key: String!): PostPageType!
  deleteInstagramItem(id: ID!): Boolean!
  deleteInstagramItemPage(pageId: ID!): Boolean!
  deleteInstagramItemPageMediaVersion(pageId: ID!, mediaS3Key: String!): InstagramItemPageType!
  updateNode(id: ID!, name: String = null, data: JSON = null): NodeType!
  updatePost(id: ID!, title: String!): PostType!
  updatePostPage(id: ID!, mediaS3Key: String, prompt: String, imageFormat: String, imageQuality: String, generationModel: String): PostPageType!
  updateInstagramItem(id: ID!, kind: String = null, title: String = null, caption: String = null, hook: String = null, visualBrief: String = null, generationPrompt: String, referenceImages: [InstagramItemReferenceImageInput!], styleId: Int, status: String = null, schedule: DateTime): InstagramItemType!
  updateInstagramItemPage(id: ID!, mediaS3Key: String, prompt: String): InstagramItemPageType!
  replacePassCriteria(milestoneId: ID!, locationId: Int!, requirements: [String!]!): Boolean!
  setPassCriterionStatus(milestoneId: ID!, locationId: Int!, criterionId: String!, status: String!): Boolean!
  setPassCriteriaStatuses(milestoneId: ID!, locationId: Int!, updates: [PassCriterionStatusInput!]!): Boolean!
