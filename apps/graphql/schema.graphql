"""
Root mutation: sales uploads, node CRUD, workflow import/export, workspace invites, workspace API adapter tools, and image AI flow configuration.
"""
type Mutation {
  createApiAdapterTool(workspaceId: ID!, name: String!, description: String!, url: String!, isActive: Boolean! = true): ApiAdapterToolType!

  """
  Upload and normalize a POS sales Excel file, persist order facts, and return metadata and sales analytics. Set includeLineItems to receive normalizedRows and orders (large payloads). Upload size is capped by MAX_SALES_REPORT_UPLOAD_BYTES (default 30 MiB).
  """
  uploadSalesReport(file: Upload!, locationId: ID!, includeLineItems: Boolean! = false): ExcelUploadResult!
  createNode(locationId: Int!, nodeType: String!, name: String = null, parentId: ID = null, description: String = null, data: JSON = null): NodeType!
  deleteNode(id: ID!): Boolean!
  exportWorkflow(workflowId: ID!, locationId: Int!): WorkflowExportType!
  importWorkflow(locationId: Int!, payload: JSON!): NodeType!
  updateNode(id: ID!, name: String = null, data: JSON = null): NodeType!
  replacePassCriteria(milestoneId: ID!, locationId: Int!, requirements: [String!]!): Boolean!
  createLocation(workspaceId: ID!, name: String!, street: String = null, city: String = null, country: String = null, currency: String): LocationType!
  createWorkspace(name: String!): WorkspaceType!
  inviteWorkspaceMember(workspaceId: ID!, clerkUserId: String!): WorkspaceMembershipType!
  startMilestoneAgentRun(runId: String!, milestoneId: ID!, workflowId: ID = null, traceparent: String = null): Boolean!
  completeMilestoneAgentRun(runId: String!, status: String!, summary: JSON = null, externalTraceId: String = null, externalTraceUrl: String = null, timeline: JSON = null, errorMessage: String = null): Boolean!
  removeWorkspaceMember(workspaceId: ID!, clerkUserId: String!): Boolean!
  updateMenuItemCogsBulk(updates: [MenuItemCogsUpdateInput!]!): [MenuItemCogsType!]!
  createImageAiFlow(slug: String!, displayName: String!, prompt: String!, model: String!, promptEnhance: String = null, imageReferenceStrength: String = null, styleIds: JSON = null, isActive: Boolean! = true, sortOrder: Int! = 0): ImageAiFlowType!
  updateImageAiFlow(slug: String!, newSlug: String, displayName: String, prompt: String, model: String, promptEnhance: String, imageReferenceStrength: String, styleIds: JSON, isActive: Boolean, sortOrder: Int): ImageAiFlowType!
  deleteApiAdapterTool(id: ID!): Boolean!
  deleteImageAiFlow(slug: String!): Boolean!
  updateApiAdapterTool(id: ID!, name: String, description: String, url: String, isActive: Boolean): ApiAdapterToolType!
}

