"""Root mutation: sales uploads, workspace invites, and catalog writes."""
type Mutation {
  """
  Upload and normalize a POS sales Excel file, persist order facts, and return metadata and sales analytics. Set includeLineItems to receive normalizedRows and orders (large payloads). Upload size is capped by MAX_SALES_REPORT_UPLOAD_BYTES (default 30 MiB).
  """
  uploadSalesReport(file: Upload!, locationId: ID!, includeLineItems: Boolean! = false): ExcelUploadResult!

  """
  Award cashback from a payment total (applies app threshold/percent) or redeem a positive amount from the customer's balance. Pass exactly one of paymentAmount or redeemAmount.
  """
  awardCrmCashback(customerId: UUID!, paymentAmount: Int = null, redeemAmount: Int = null, label: String = null): CrmCashbackEntryType!
  createPost(title: String = null): PostType!
  createPostPage(postId: ID!, mediaS3Key: String, prompt: String, imageFormat: String, imageQuality: String, generationModel: String): PostPageType!
  deletePost(id: ID!): Boolean!
  deletePostPage(pageId: ID!): Boolean!
  deletePostPageMediaVersion(pageId: ID!, mediaS3Key: String!): PostPageType!
  updatePost(id: ID!, title: String!): PostType!
  updatePostPage(id: ID!, mediaS3Key: String, prompt: String, imageFormat: String, imageQuality: String, generationModel: String): PostPageType!
  createLocation(workspaceId: ID!, name: String!, street: String = null, city: String = null, country: String = null, currency: String): LocationType!

  """Create a named visual style pack in the caller's workspace."""
  createStyle(name: String!, referenceImageName: String!, spec: JSON!, isDefault: Boolean! = false): StyleType!

  """Create a named media collection in the caller's workspace."""
  createMediaCollection(name: String!): MediaCollectionType!

  """Create a CRM app in the caller's primary workspace."""
  createCrmApp(title: String!): CrmAppType!

  """
  Create a single-use enrollment token for a CRM app. Returns the raw token once; expires in 5 minutes.
  """
  createCrmEnrollmentToken(appId: Int!): CrmEnrollmentTokenCreatedType!

  """Create a manual calendar entry for a location."""
  createCalendarEntry(locationId: Int!, title: String!, date: String!, time: String!, description: String = null, mediaRefs: [CalendarMediaRefInput!] = null): CalendarEntryType!
  createWorkspace(name: String!): WorkspaceType!
  inviteWorkspaceMember(workspaceId: ID!, clerkUserId: String!): WorkspaceMembershipType!
  removeWorkspaceMember(workspaceId: ID!, clerkUserId: String!): Boolean!
  upsertMenuItemCogsBulk(analyticsRunId: ID!, items: [MenuItemCogsUpsertInput!]!): [MenuItemCogsType!]!
  upsertLocationMenuItemCogsBulk(locationId: ID!, items: [LocationMenuItemCogsUpsertInput!]!): [LocationMenuItemCogsType!]!

  """Refresh an analytics run's COGS snapshot from its location catalog."""
  applyLocationCogsToAnalyticsRun(analyticsRunId: ID!): [MenuItemCogsType!]!

  """Promote an analytics run's COGS snapshot into the location catalog."""
  saveAnalyticsRunCogsToLocation(analyticsRunId: ID!): [LocationMenuItemCogsType!]!

  """Add a pantry item to the workspace catalog."""
  createInventoryCatalogItem(workspaceId: Int!, name: String!, packageSize: Float!, packageUnit: String!, storageZone: InventoryStorageZone = null, price: Float = null, minOnHand: Float = null, maxOnHand: Float = null): InventoryCatalogItemType!

  """Update a pantry catalog item."""
  updateInventoryCatalogItem(id: Int!, name: String = null, packageSize: Float = null, packageUnit: String = null, storageZone: InventoryStorageZone = null, price: Float, minOnHand: Float, maxOnHand: Float): InventoryCatalogItemType!

  """Delete a pantry catalog item and all location stock rows."""
  deleteInventoryCatalogItem(id: Int!): Boolean!

  """Set current stock for a catalog item at a location."""
  upsertInventoryStock(locationId: Int!, catalogItemId: Int!, onHand: Float!): InventoryStockType!

  """
  Receive packages at a location (increases stock and records an in movement).
  """
  receiveInventoryStock(locationId: Int!, catalogItemId: Int!, quantity: Float!, occurredOn: Date = null): InventoryStockType!

  """Use packages from stock (decreases stock and records an out movement)."""
  consumeInventoryStock(stockId: Int!, quantity: Float!, occurredOn: Date = null): InventoryStockType!

  """Stop tracking a catalog item at a location."""
  deleteInventoryStock(id: Int!): Boolean!

  """Move packages of a tracked item from one location to another."""
  transferInventoryStock(fromStockId: Int!, toLocationId: Int!, quantity: Float!, occurredOn: Date = null): InventoryStockTransferResult!

  """Create a catalog item and initial stock at a location in one step."""
  createInventoryCatalogItemWithStock(locationId: Int!, name: String!, packageSize: Float!, packageUnit: String!, onHand: Float!, storageZone: InventoryStorageZone = null, price: Float = null, minOnHand: Float = null, maxOnHand: Float = null): InventoryStockType!
  deleteAnalyticsRun(analyticsRunId: ID!): Boolean!

  """Delete a manual calendar entry."""
  deleteCalendarEntry(id: Int!): CalendarEntryType!

  """Delete a CRM app by id."""
  deleteCrmApp(id: Int!): Boolean!

  """Delete a CRM customer registration by id. Cascades enrolled devices."""
  deleteCrmCustomer(id: UUID!): Boolean!

  """Delete a visual style pack by id."""
  deleteStyle(id: Int!): Boolean!

  """Delete a media collection by id (memberships cascade)."""
  deleteMediaCollection(id: Int!): Boolean!

  """
  Delete a media asset catalog row by filename (memberships cascade). Returns true when a row was removed; false when already absent.
  """
  deleteMediaAsset(filename: String!): Boolean!

  """
  Idempotently create or update a media asset catalog row for a workspace photo filename.
  """
  ensureMediaAsset(filename: String!, displayName: String = null): MediaAssetType!

  """Add a photo (by filename) to a media collection."""
  addMediaToCollection(collectionId: Int!, filename: String!): MediaCollectionType!

  """Remove a photo (by filename) from a media collection."""
  removeMediaFromCollection(collectionId: Int!, filename: String!): MediaCollectionType!

  """
  Revoke a CRM device so it can no longer authenticate. Clears refresh token hash. Idempotent if already revoked.
  """
  revokeCrmDevice(deviceId: UUID!): CrmDeviceType!

  """
  Append an AI usage ledger row for the authenticated user (Leonardo generations and similar).
  """
  recordAiUsageEvent(provider: String!, feature: String!, status: String!, model: String = null, externalId: String = null, units: Int! = 1, metadata: JSON = null): AiUsageEventType!

  """Update a manual calendar entry."""
  updateCalendarEntry(id: Int!, title: String = null, date: String = null, time: String = null, description: String, mediaRefs: [CalendarMediaRefInput!]): CalendarEntryType!

  """Update a CRM app by id."""
  updateCrmApp(id: Int!, title: String!, cashbackThresholdAmount: Int = null, cashbackPercent: Int = null): CrmAppType!
  updateLocation(id: ID!, name: String, street: String, city: String, country: String, currency: String, openingHours: [OpeningHourInput!]): LocationType!

  """
  Replace owner manual brief hints for a location. Pass quickProfile {} to clear. Does not modify AI-generated location_social_settings.
  """
  updateLocationManualBriefInput(locationId: Int!, quickProfile: JSON!): LocationManualBriefInputType!

  """Update a visual style pack in the caller's workspace."""
  updateStyle(id: Int!, name: String = null, referenceImageName: String = null, spec: JSON = null, isDefault: Boolean = null): StyleType!

  """Rename a media collection by id."""
  updateMediaCollection(id: Int!, name: String!): MediaCollectionType!
}

