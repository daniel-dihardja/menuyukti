"""
Root query: locations, workflow nodes, sales analytics runs, menu engineering, heatmaps, and workspace membership.
"""
type Query {
  """
  Load a workflow node, its milestones (ordered like `nodes`). Returns null if the id is missing, not a workflow, or not owned by the caller.
  """
  workflowCampaignTree(workflowId: ID!): WorkflowCampaignTreeType

  """
  Return multiple analytics sections for one run using a shared OrderFact load. Use options to omit sections you do not need.
  """
  analyticsBundle(analyticsRunId: ID!, locationId: ID = null, options: AnalyticsBundleOptionsInput = null): AnalyticsBundleType

  """
  Resolve the newest analytics run for a location and return instagramSignals in one request (single OrderFact load path when signals are requested).
  """
  latestAnalyticsRunWithSignals(locationId: Int!): LatestAnalyticsRunWithSignalsType

  """
  All locations the current user can access (direct owner or workspace member).
  """
  locations(first: Int = null): [LocationType!]!

  """
  Analytics run counts and latest run per location in one query. Only returns summaries for locations the caller can access.
  """
  locationAnalyticsSummaries(locationIds: [Int!]!): [LocationAnalyticsSummaryType!]!

  """Fetch one location by id if the caller has access."""
  location(id: ID!): LocationType

  """
  Owner click-first brief hints for a location. Empty quickProfile when unset. Not AI-generated.
  """
  locationManualBriefInput(locationId: Int!): LocationManualBriefInputType

  """List visual style packs in workspaces the current user belongs to."""
  styles: [StyleType!]!

  """Fetch one visual style pack by id. Null when missing or access denied."""
  style(id: Int!): StyleType

  """
  List nodes for a location, optionally filtered by nodeType and/or parentId. Results are paginated with `first` (default and max 500). When parentId is omitted, use `afterId` (last-seen node id) for cursor pagination in primary-key-desc order (aligned with creation order for autoincrement ids).
  """
  nodes(locationId: Int!, nodeType: String = null, parentId: ID = null, first: Int = null, afterId: ID = null): [NodeType!]!

  """Fetch a single node by id if the caller owns its location."""
  node(id: ID!): NodeType

  """Fetch metadata and COGS for a single analytics run by ID."""
  analyticsRun(id: ID!): AnalyticsRunType

  """
  List analytics runs for a location, newest first. Use `first` to cap rows (default 100, max 300).
  """
  analyticsRuns(locationId: Int!, first: Int = null): [AnalyticsRunListItemType!]!

  """
  Compute average order size and revenue for an analytics run. Returns None if the run has no order data.
  """
  orderMetrics(analyticsRunId: ID!): AnalyticsRunOrderMetricsType

  """
  Return basket affinity analytics for an analytics run: menu pairs ordered together, with lift and confidence metrics. Defaults to star items when menu engineering matrix is available; otherwise top items by order presence. When locationId is set, the run must belong to that location.
  """
  menuCombos(analyticsRunId: ID!, locationId: ID = null): MenuCombosPayloadType

  """
  Return hourly and day-of-week demand heatmaps for every menu item in an analytics run. Use this to identify peak selling times per dish. When locationId is set, the run must belong to that location (otherwise returns an empty list).
  """
  menuHeatmaps(analyticsRunId: ID!, locationId: ID = null): [MenuHeatmapType!]!

  """
  Compute the menu engineering BCG matrix for an analytics run. Requires COGS to be set; returns None if no COGS are available. Optionally filter returned items to specific categories (star, puzzle, plow_horse, low_end) — thresholds and distribution always reflect the full dataset. When locationId is set, the run must belong to that location (otherwise returns null).
  """
  menuEngineeringMatrix(analyticsRunId: ID!, categories: [String!] = null, locationId: ID = null): MenuEngineeringMatrixType

  """
  Distinct menu items from the latest analytics run for a location: aggregated from order lines (category, avg unit price). Returns null when there is no run or no order data.
  """
  menuItemsCatalog(locationId: Int!): MenuCatalogPayloadType

  """
  Distinct menu items from a specific analytics run: aggregated from order lines (quantity, category, avg unit price). Returns null when run is missing/unauthorized or has no order data.
  """
  menuItemsCatalogForRun(analyticsRunId: ID!): MenuCatalogPayloadType

  """
  Return per-menu promotion signals for an analytics run: volume and revenue, optional BCG-style menu-engineering metrics when COGS allow, and peak hour/day from demand heatmaps. When locationId is set, the run must belong to that location (otherwise returns null).
  """
  promotionMenuItems(analyticsRunId: ID!, locationId: ID = null): PromotionMenuItemsPayloadType

  """
  Top star and puzzle menu items derived from menu engineering. Each element in `starItems` / `puzzleItems` is an object with `menu`, `quantity` (units sold in the bucket), and `popularity` (share of bucket quantity, 0–1). When POS menu categories exist, returns `grouping=by_menu_category` with `categories.<menu_category>.starItems` and `puzzleItems`. Optional `maxStarItems` / `maxPuzzleItems` default to 5 and 10; pass 0 or a negative value for unlimited. Otherwise returns `grouping=flat` with root `starItems` and `puzzleItems`.
  """
  promotionEngineeringCandidates(analyticsRunId: ID!, locationId: ID = null, maxStarItems: Int = null, maxPuzzleItems: Int = null): JSON

  """
  Rank menu promotion candidates per venue slot (day × meal_period). Combines slot demand profile, per-slot order-line sales, and global menu engineering classification. Returns null when the run has no order facts. When COGS are missing, matrixAvailable is false and candidates are ranked by slot sales only. When locationId is set, the run must belong to that location (otherwise returns null).
  """
  slotMenuCandidates(analyticsRunId: ID!, locationId: ID = null, options: SlotMenuCandidatesOptionsInput = null): SlotMenuCandidatesType
  publicHolidays(country: String!, startDate: String!, endDate: String!): [PublicHolidayType!]!

  """
  Aggregate scheduler milestone slots and manual calendar entries for a location. Returns an empty payload when the caller is unauthenticated, does not own the location, or there are no scheduler milestones or manual entries.
  """
  schedulerCalendar(locationId: Int!): SchedulerCalendarPayload!
  operatingProfile(locationId: ID!, analyticsRunId: ID!): OperatingProfileType

  """Posts in workspaces the current user belongs to, newest first."""
  posts(first: Int = null): [PostType!]!

  """A single post in the caller's workspace, with pages."""
  post(id: ID!): PostType

  """
  Instagram items for a workflow the caller owns, earliest schedule first (unscheduled last).
  """
  instagramItems(workflowId: ID!): [InstagramItemType!]!

  """A single Instagram item owned via its workflow location."""
  instagramItem(id: ID!): InstagramItemType

  """
  Composite Instagram signals for an analytics run: content heroes, trending items, avoid list, category focus, best posting window, and period headline. Requires order facts; returns null if none.
  """
  instagramSignals(analyticsRunId: ID!, locationId: ID = null): InstagramSignalsType

  """
  Revenue and quantity share per menu category for an analytics run. Returns null when the run has no order lines.
  """
  categoryMix(analyticsRunId: ID!, locationId: ID = null): CategoryMixPayloadType

  """
  Compare per-menu revenue for an analytics run against the previous run for the same location (or an explicit previousRunId). Returns null when the current run has no order lines.
  """
  revenueTrends(analyticsRunId: ID!, locationId: ID = null, previousRunId: ID = null): RevenueTrendsPayloadType

  """
  Bill-level revenue and transaction counts rolled up by ISO week for the latest analytics run. Indices are normalized to mean 1.0 within the series.
  """
  weeklyDemandPattern(locationId: Int!): WeeklyDemandPatternPayloadType

  """
  JSON array of prior milestones' preset payloads: each element is `{"id": string, "title": string, "presetId": string|null, "data": object|null}` for milestones strictly before the given milestone in workflow display order. `id` is the milestone node id. `presetId` is copied from the milestone node's `data.presetId` when set (e.g. `restaurant_campaign_brief`). `data` is the `milestone_preset_data` column (flat preset JSON). Empty array when there are no prior milestones or the request is not authorized.
  """
  priorMilestonesMilestoneData(workflowId: ID!, milestoneId: ID!, locationId: Int!): JSON!
  myWorkspace: WorkspaceType
  workspaceMembers(workspaceId: ID!, first: Int = null): [WorkspaceMembershipType!]!
  imageAiFlows(includeInactive: Boolean! = false): [ImageAiFlowType!]!
  imageAiFlow(slug: String!): ImageAiFlowType

  """
  Return location profile and latest analytics-run inputs for IG Plan in one request. Uses a single OrderFact load for slot demand, menu engineering matrix, and slot menu candidates. Returns null when the caller cannot access the location.
  """
  igPlanInputs(locationId: Int!, analyticsRunId: ID = null, options: IgPlanInputsOptionsInput = null): IgPlanInputsType
}

