[project]
name = "menu-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.4",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "python-multipart>=0.0.21",
    "uvicorn[standard]>=0.38.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.analytics",
    "app.analytics.esb",
    "app.decision",
    "app.decision.allocation",
    "app.decision.decisions",
    "app.decision.enrichment",
    "app.decision.models",
    "app.decision.pipeline",
    "app.decision.primitives",
    "app.decision.primitives.engine",
    "app.decision.roles",
    "app.decision.signals",
]

[tool.setuptools.package-dir]
"app" = "app"
