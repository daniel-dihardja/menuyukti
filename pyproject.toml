[project]
name = "menuyukti-workspace"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "menu-analytics",
  "agent",
  "marketing-engine",
]

[tool.uv.workspace]
members = [
  "apps/menu-analytics",
  "apps/agents",
  "packages/marketing-engine",
]

[tool.uv.sources]
menu-analytics = { workspace = true }
agent = { workspace = true }
marketing-engine = { workspace = true }

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "langgraph-cli[inmem]>=0.4.12",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "psycopg[binary]>=3.2.13",
  "pytest>=9.0.0",
  "python-dotenv>=1.2.1",
  "sqlalchemy>=2.0.44",
]
