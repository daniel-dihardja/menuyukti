[project]
name = "menuyukti-workspace"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "menuyukti",
]

[tool.uv.workspace]
members = [
  "packages/menuyukti",
  "apps/graphql",
]

[tool.uv.sources]
menuyukti = { workspace = true }

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "matplotlib>=3.10.8",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "psycopg[binary]>=3.2.13",
  "pytest>=9.0.0",
  "python-dotenv>=1.2.1",
  "sqlalchemy>=2.0.44",
]
