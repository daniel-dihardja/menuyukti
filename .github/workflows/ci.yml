# Lint, typecheck, and test on every PR (including into develop) and on push to main.
# Pushes to develop do not run CI: format/lint/tests already ran on the merged feature PR.
# Deploy still runs on push to develop (see deploy.yml).
# Path filters skip unrelated jobs; Node uses Turbo --affected on PRs, full run on push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.filter.outputs.node }}
      graphql: ${{ steps.filter.outputs.graphql }}
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'lint-staged.config.mjs'
              - '.husky/**'
              - '.github/workflows/**'
            graphql:
              - 'apps/graphql/**'
              - 'packages/menuyukti/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            agents:
              - 'apps/agents/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  node:
    name: Web (Prettier, types, ESLint, tests)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PRs: only affected workspace packages (base = PR target branch). Push: full run for safety.
      - name: Turbo (affected packages)
        if: github.event_name == 'pull_request'
        env:
          # Use explicit SHAs to avoid ambiguous merge-base resolution on criss-cross histories.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec turbo run format-check lint check-types test --affected
      - name: Turbo (full)
        if: github.event_name == 'push'
        run: pnpm exec turbo run format-check lint check-types test
      # Top-level Markdown not owned by a workspace package format-check script
      - name: Prettier (repo root docs)
        run: pnpm exec prettier --check README.md AGENTS.md

  graphql:
    name: GraphQL (Ruff, mypy, pytest)
    needs: changes
    if: needs.changes.outputs.graphql == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d graphql_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
        working-directory: apps/graphql
      # Schema vs models (not Ruff/Prettier). Fails if migrations drift from SQLAlchemy models.
      - name: Alembic upgrade (Postgres)
        working-directory: apps/graphql
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/graphql_test
        run: PYTHONPATH=../.. uv run alembic upgrade head
      - name: Alembic check (migrations match models)
        working-directory: apps/graphql
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/graphql_test
        run: PYTHONPATH=../.. uv run alembic check
      - run: make lint
        working-directory: apps/graphql
      - run: make typecheck
        working-directory: apps/graphql
      - run: make test
        working-directory: apps/graphql

  agents:
    name: Agents (Ruff, mypy, pytest)
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
        working-directory: apps/agents
      - run: make lint
        working-directory: apps/agents
      - run: make typecheck
        working-directory: apps/agents
      - run: make test
        working-directory: apps/agents
