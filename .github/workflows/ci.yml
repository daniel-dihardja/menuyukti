# Lint, typecheck, and test on every PR and push to main/develop.
# Path filters skip unrelated jobs; Node uses Turbo --affected on PRs, full run on push.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.filter.outputs.node }}
      graphql: ${{ steps.filter.outputs.graphql }}
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'lint-staged.config.mjs'
              - '.husky/**'
              - '.github/workflows/**'
            graphql:
              - 'apps/graphql/**'
              - 'packages/menuyukti/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            agents:
              - 'apps/agents/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

  node:
    name: Web (Prettier, types, ESLint, tests)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base ref (pull requests)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PRs: only affected workspace packages (base = PR target branch). Push: full run for safety.
      - name: Turbo (affected packages)
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: pnpm exec turbo run format-check lint check-types test --affected
      - name: Turbo (full)
        if: github.event_name == 'push'
        run: pnpm exec turbo run format-check lint check-types test
      # Top-level Markdown not owned by a workspace package format-check script
      - name: Prettier (repo root docs)
        run: pnpm exec prettier --check README.md AGENTS.md

  graphql:
    name: GraphQL (Ruff, mypy, pytest)
    needs: changes
    if: needs.changes.outputs.graphql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
        working-directory: apps/graphql
      - run: make lint
        working-directory: apps/graphql
      - run: make typecheck
        working-directory: apps/graphql
      - run: make test
        working-directory: apps/graphql

  agents:
    name: Agents (Ruff, mypy, pytest)
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
        working-directory: apps/agents
      - run: make lint
        working-directory: apps/agents
      - run: make typecheck
        working-directory: apps/agents
      - run: make test
        working-directory: apps/agents
