# Reusable: build and push a Menuyukti service image to Docker Hub.
#
# Repository secrets (callers use secrets: inherit):
#   DOCKERHUB_USERNAME — Docker Hub user or org
#   DOCKERHUB_PASSWORD — Docker Hub password or access token
#   DATABASE_URL       — required when service=web (Next/Prisma build)
#   SSH_HOST           — hostname or IP, OR user@host (remote-pull uses ssh -l so login is never "runner")
#   SSH_PRIVATE_KEY    — private key matching the server (PEM/OpenSSH), for remote-pull
#   SSH_USER           — optional; used only when SSH_HOST has no @ (default: deploy).
#                        GitHub’s runner user is not your server user—bare IPs need user@.
#
# Optional repository variable:
#   DOCKER_IMAGE_PREFIX — image namespace (default johngoyason), set in callers if empty;
#                        must match image: names in docker-compose.yml (remote pull uses it for docker pull).
#
# Manual run: Actions → "Reusable Docker build and push" → choose preset (web | graphql | agents).

name: Reusable Docker build and push

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "graphql | agents | web"
      dockerfile:
        required: true
        type: string
      image_repository:
        required: true
        type: string
        description: "Registry path without tag, e.g. johngoyason/menuyukti-graphql"
      custom_tag:
        required: false
        type: string
        default: ""
        description: "If non-empty, push only this tag. Otherwise sha-* and latest on default branch."
  workflow_dispatch:
    inputs:
      preset:
        description: "Which image to build and push (same mapping as Docker — web/graphql/gentic-agents)"
        required: true
        type: choice
        options:
          - web
          - graphql
          - agents
      custom_tag:
        description: "Optional single tag (empty = sha-* + latest on default branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        env:
          PREFIX: ${{ vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "${{ inputs.preset }}" in
              web)
                echo "service=web" >> "$GITHUB_OUTPUT"
                echo "dockerfile=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"
                echo "image_repository=${PREFIX}/menuyukti-web" >> "$GITHUB_OUTPUT"
                ;;
              graphql)
                echo "service=graphql" >> "$GITHUB_OUTPUT"
                echo "dockerfile=apps/graphql/Dockerfile" >> "$GITHUB_OUTPUT"
                echo "image_repository=${PREFIX}/menuyukti-graphql" >> "$GITHUB_OUTPUT"
                ;;
              agents)
                echo "service=agents" >> "$GITHUB_OUTPUT"
                echo "dockerfile=apps/gentic-agents/Dockerfile" >> "$GITHUB_OUTPUT"
                echo "image_repository=${PREFIX}/menuyukti-agents" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Invalid preset" >&2
                exit 1
                ;;
            esac
          else
            echo "service=${{ inputs.service }}" >> "$GITHUB_OUTPUT"
            echo "dockerfile=${{ inputs.dockerfile }}" >> "$GITHUB_OUTPUT"
            echo "image_repository=${{ inputs.image_repository }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (multi-arch builds on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute image tags
        id: meta
        env:
          REPO: ${{ steps.params.outputs.image_repository }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="${CUSTOM_TAG#"${CUSTOM_TAG%%[![:space:]]*}"}"
          tag="${tag%"${tag##*[![:space:]]}"}"
          {
            echo 'list<<EOF'
            if [ -n "$tag" ]; then
              echo "${REPO}:${tag}"
            else
              short=$(echo "$SHA" | cut -c1-7)
              echo "${REPO}:sha-${short}"
              if [ "$REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                echo "${REPO}:latest"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (web)
        if: steps.params.outputs.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.params.outputs.dockerfile }}
          push: true
          # Typical VPS is amd64; arm64 covers Apple Silicon / ARM hosts (manifest list on Hub).
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.list }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ANALYTICS_API_URL=http://127.0.0.1:8000

      - name: Build and push
        if: steps.params.outputs.service != 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.params.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.list }}

  remote-pull:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file and pull images on server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_VALUE: ${{ secrets.SSH_HOST }}
          SSH_USER_OVERRIDE: ${{ secrets.SSH_USER }}
          DOCKER_IMAGE_PREFIX: ${{ vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || {
            echo "SSH_PRIVATE_KEY is not a valid private key (check newlines in the GitHub secret)." >&2
            exit 1
          }
          # Trim; avoid bare hostname (OpenSSH would use local user "runner" on GHA).
          raw="${SSH_HOST_VALUE:?SSH_HOST secret is not set}"
          host_spec=$(printf '%s' "$raw" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ "$host_spec" == *@* ]]; then
            ssh_user="${host_spec%%@*}"
            ssh_host="${host_spec#*@}"
            if [[ -z "$ssh_user" ]]; then
              ssh_user="${SSH_USER_OVERRIDE:-deploy}"
            fi
          else
            ssh_user="${SSH_USER_OVERRIDE:-deploy}"
            ssh_host="$host_spec"
          fi
          if [[ -z "$ssh_host" ]]; then
            echo "After parsing SSH_HOST, hostname is empty. Set SSH_HOST to host or user@host." >&2
            exit 1
          fi
          common_ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote_dir=/opt/menuyukti
          compose_file="${remote_dir}/docker-compose.yml"
          ssh "${common_ssh_opts[@]}" -l "$ssh_user" "$ssh_host" "mkdir -p '${remote_dir}'"
          scp "${common_ssh_opts[@]}" docker-compose.yml "${ssh_user}@${ssh_host}:${compose_file}"
          # Use docker pull, not compose pull: Snap / confined Docker often cannot read compose files
          # under /opt even when they exist; pulling by image ref only talks to the daemon.
          printf '%s\n' \
            'set -euo pipefail' \
            "docker pull ${DOCKER_IMAGE_PREFIX}/menuyukti-graphql:latest" \
            "docker pull ${DOCKER_IMAGE_PREFIX}/menuyukti-agents:latest" \
            "docker pull ${DOCKER_IMAGE_PREFIX}/menuyukti-web:latest" \
            | ssh "${common_ssh_opts[@]}" -l "$ssh_user" "$ssh_host" bash -s
