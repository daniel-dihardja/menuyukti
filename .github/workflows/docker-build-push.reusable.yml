# Reusable: build and push a Menuyukti service image to Docker Hub.
#
# Repository secrets (callers use secrets: inherit):
#   DOCKERHUB_USERNAME — Docker Hub user or org
#   DOCKERHUB_PASSWORD — Docker Hub password or access token
#   DATABASE_URL       — required when service=web (Next/Prisma build)
#
# Optional repository variable:
#   DOCKER_IMAGE_PREFIX — image namespace (default johngoyason); should match image: names in docker-compose.yml.
#
# Remote server: copy compose + pull images via workflow "Docker — remote compose pull" (docker-remote-pull.yml).
#
# Manual run: Actions → "Reusable Docker build and push" → choose preset (web | graphql | agents).

name: Reusable Docker build and push

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "graphql | agents | web"
      dockerfile:
        required: true
        type: string
      image_repository:
        required: true
        type: string
        description: "Registry path without tag, e.g. johngoyason/menuyukti-graphql"
      custom_tag:
        required: false
        type: string
        default: ""
        description: "If non-empty, push only this tag. Otherwise sha-* and latest on default branch."
  workflow_dispatch:
    inputs:
      preset:
        description: "Which image to build and push (same mapping as Docker — web/graphql/gentic-agents)"
        required: true
        type: choice
        options:
          - web
          - graphql
          - agents
      custom_tag:
        description: "Optional single tag (empty = sha-* + latest on default branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        env:
          PREFIX: ${{ vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason' }}
          CALL_SERVICE: ${{ inputs.service }}
          CALL_DOCKERFILE: ${{ inputs.dockerfile }}
          CALL_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail
          # workflow_call: caller passes service/dockerfile/image_repository (github.event_name may still be
          # workflow_dispatch on the parent — do not branch on event name). workflow_dispatch on this workflow
          # only sets preset; call inputs are empty.
          if [ -n "$CALL_SERVICE" ]; then
            echo "service=${CALL_SERVICE}" >> "$GITHUB_OUTPUT"
            echo "dockerfile=${CALL_DOCKERFILE}" >> "$GITHUB_OUTPUT"
            echo "image_repository=${CALL_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          else
            case "${{ inputs.preset }}" in
              web)
                echo "service=web" >> "$GITHUB_OUTPUT"
                echo "dockerfile=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"
                echo "image_repository=${PREFIX}/menuyukti-web" >> "$GITHUB_OUTPUT"
                ;;
              graphql)
                echo "service=graphql" >> "$GITHUB_OUTPUT"
                echo "dockerfile=apps/graphql/Dockerfile" >> "$GITHUB_OUTPUT"
                echo "image_repository=${PREFIX}/menuyukti-graphql" >> "$GITHUB_OUTPUT"
                ;;
              agents)
                echo "service=agents" >> "$GITHUB_OUTPUT"
                echo "dockerfile=apps/gentic-agents/Dockerfile" >> "$GITHUB_OUTPUT"
                echo "image_repository=${PREFIX}/menuyukti-agents" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Invalid preset (run from Actions UI on this workflow and choose web, graphql, or agents)" >&2
                exit 1
                ;;
            esac
          fi

      - name: Set up QEMU (multi-arch builds on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute image tags
        id: meta
        env:
          REPO: ${{ steps.params.outputs.image_repository }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="${CUSTOM_TAG#"${CUSTOM_TAG%%[![:space:]]*}"}"
          tag="${tag%"${tag##*[![:space:]]}"}"
          {
            echo 'list<<EOF'
            if [ -n "$tag" ]; then
              echo "${REPO}:${tag}"
            else
              short=$(echo "$SHA" | cut -c1-7)
              echo "${REPO}:sha-${short}"
              if [ "$REF" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                echo "${REPO}:latest"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (web)
        if: steps.params.outputs.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.params.outputs.dockerfile }}
          push: true
          # Typical VPS is amd64; arm64 covers Apple Silicon / ARM hosts (manifest list on Hub).
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.list }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ANALYTICS_API_URL=http://127.0.0.1:8000

      - name: Build and push
        if: steps.params.outputs.service != 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.params.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.list }}
