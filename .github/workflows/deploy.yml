# Selective Docker image builds (web / graphql / agents) then remote compose pull — same server steps as
# "Docker — remote compose pull" (docker-remote-pull.yml).
#
# Web: Turbo `build --affected` over the deploy git range, plus path fallbacks matching apps/web/Dockerfile.
# GraphQL / agents: path rules aligned with each Dockerfile COPY (Python apps are not Turbo packages).
#
# Secrets: same as docker-build-push.reusable.yml and docker-remote-pull.yml (DOCKERHUB_*, web build args, SSH_*).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Build and push all three images regardless of change detection"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.plan.outputs.web }}
      graphql: ${{ steps.plan.outputs.graphql }}
      agents: ${{ steps.plan.outputs.agents }}
      stack_config: ${{ steps.plan.outputs.stack_config }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Resolve deploy range and build flags
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build_all || false }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          write_tf() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          }

          git fetch origin "$DEFAULT_BRANCH"

          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_REF="origin/${DEFAULT_BRANCH}"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ]; then
              BASE_REF="$BEFORE"
            else
              BASE_REF="origin/${DEFAULT_BRANCH}"
            fi
          else
            BASE_REF="origin/${DEFAULT_BRANCH}"
          fi

          if [ "$INPUT_FORCE" = "true" ]; then
            write_tf web true
            write_tf graphql true
            write_tf agents true
            write_tf stack_config false
            write_tf deploy true
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE_REF" "$HEAD_SHA" || true)

          stack=false
          if echo "$FILES" | grep -qxF 'docker-compose.yml' || echo "$FILES" | grep -qxF 'Caddyfile'; then
            stack=true
          fi

          gql=false
          agents=false
          web_path=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              apps/graphql/*)
                gql=true
                ;;
              packages/menuyukti/*)
                gql=true
                agents=true
                ;;
              pyproject.toml|uv.lock)
                gql=true
                agents=true
                ;;
              apps/agents/pyproject.toml)
                gql=true
                agents=true
                ;;
              apps/graphql/pyproject.toml)
                agents=true
                ;;
              apps/agents/*)
                agents=true
                ;;
              apps/web/*|packages/ui/*|packages/typescript-config/*|packages/eslint-config/*)
                web_path=true
                ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|apps/web/Dockerfile)
                web_path=true
                ;;
            esac
          done <<< "$FILES"

          export TURBO_SCM_BASE="$BASE_REF"
          export TURBO_SCM_HEAD="$HEAD_SHA"
          pnpm install --frozen-lockfile
          turbo_web=$(pnpm exec turbo run build --affected --dry-run=json | jq -r 'any(.tasks[]?; .package == "web")')
          web=false
          if [ "$turbo_web" = "true" ] || [ "$web_path" = "true" ]; then
            web=true
          fi

          deploy=false
          if [ "$web" = "true" ] || [ "$gql" = "true" ] || [ "$agents" = "true" ] || [ "$stack" = "true" ]; then
            deploy=true
          fi

          write_tf web "$web"
          write_tf graphql "$gql"
          write_tf agents "$agents"
          write_tf stack_config "$stack"
          write_tf deploy "$deploy"

  build_web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    uses: ./.github/workflows/docker-build-push.reusable.yml
    secrets: inherit
    with:
      service: web
      dockerfile: apps/web/Dockerfile
      image_repository: ${{ format('{0}/menuyukti-web', vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason') }}
      custom_tag: ""

  build_graphql:
    needs: detect
    if: needs.detect.outputs.graphql == 'true'
    uses: ./.github/workflows/docker-build-push.reusable.yml
    secrets: inherit
    with:
      service: graphql
      dockerfile: apps/graphql/Dockerfile
      image_repository: ${{ format('{0}/menuyukti-graphql', vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason') }}
      custom_tag: ""

  build_agents:
    needs: detect
    if: needs.detect.outputs.agents == 'true'
    uses: ./.github/workflows/docker-build-push.reusable.yml
    secrets: inherit
    with:
      service: agents
      dockerfile: apps/agents/Dockerfile
      image_repository: ${{ format('{0}/menuyukti-agents', vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason') }}
      custom_tag: ""

  deploy_remote:
    needs: [detect, build_web, build_graphql, build_agents]
    if: |
      needs.detect.outputs.deploy == 'true' &&
      always() && !failure() && !cancelled() &&
      (needs.build_web.result == 'success' || needs.build_web.result == 'skipped') &&
      (needs.build_graphql.result == 'success' || needs.build_graphql.result == 'skipped') &&
      (needs.build_agents.result == 'success' || needs.build_agents.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose, pull, up, and prune on server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_VALUE: ${{ secrets.SSH_HOST }}
          SSH_USER_OVERRIDE: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || {
            echo "SSH_PRIVATE_KEY is not a valid private key (check newlines in the GitHub secret)." >&2
            exit 1
          }
          # Trim; avoid bare hostname (OpenSSH would use local user "runner" on GHA).
          raw="${SSH_HOST_VALUE:?SSH_HOST secret is not set}"
          host_spec=$(printf '%s' "$raw" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ "$host_spec" == *@* ]]; then
            ssh_user="${host_spec%%@*}"
            ssh_host="${host_spec#*@}"
            if [[ -z "$ssh_user" ]]; then
              ssh_user="${SSH_USER_OVERRIDE:-deploy}"
            fi
          else
            ssh_user="${SSH_USER_OVERRIDE:-deploy}"
            ssh_host="$host_spec"
          fi
          if [[ -z "$ssh_host" ]]; then
            echo "After parsing SSH_HOST, hostname is empty. Set SSH_HOST to host or user@host." >&2
            exit 1
          fi
          common_ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote_dir=/opt/menuyukti
          compose_file="${remote_dir}/docker-compose.yml"
          ssh "${common_ssh_opts[@]}" -l "$ssh_user" "$ssh_host" "mkdir -p '${remote_dir}'"
          scp "${common_ssh_opts[@]}" docker-compose.yml "${ssh_user}@${ssh_host}:${compose_file}"
          scp "${common_ssh_opts[@]}" Caddyfile "${ssh_user}@${ssh_host}:${remote_dir}/Caddyfile"
          printf '%s\n' \
            'set -euo pipefail' \
            "cd '${remote_dir}'" \
            'docker compose pull' \
            'docker compose up -d --remove-orphans' \
            'docker system prune -f' \
            'docker image prune -af' \
            | ssh "${common_ssh_opts[@]}" -l "$ssh_user" "$ssh_host" bash -s
