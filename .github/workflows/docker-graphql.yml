# Build and push GraphQL image (menuyukti-graphql). Independent of agents/web.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (see docker-build-push.reusable.yml)
# Optional variable: DOCKER_IMAGE_PREFIX (default johngoyason)

name: Docker — graphql

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional single tag (empty = sha-* + latest on default branch)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/graphql/**"
      - "packages/menuyukti/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build-push:
    uses: ./.github/workflows/docker-build-push.reusable.yml
    secrets: inherit
    with:
      service: graphql
      dockerfile: apps/graphql/Dockerfile
      image_repository: ${{ format('{0}/menuyukti-graphql', vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason') }}
      custom_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
