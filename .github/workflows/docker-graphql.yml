# Build and push GraphQL image (menuyukti-graphql). Manual only — Actions → Run workflow (optional tag).
# Server: run "Docker — remote compose pull" after images exist on Docker Hub.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD (see docker-build-push.reusable.yml)
# Optional variable: DOCKER_IMAGE_PREFIX (default johngoyason)

name: Docker — graphql

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional single tag (empty = sha-* + latest on default branch)"
        required: false
        type: string
        default: ""

jobs:
  build-push:
    uses: ./.github/workflows/docker-build-push.reusable.yml
    secrets: inherit
    with:
      service: graphql
      dockerfile: apps/graphql/Dockerfile
      image_repository: ${{ format('{0}/menuyukti-graphql', vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason') }}
      custom_tag: ${{ github.event.inputs.tag }}
