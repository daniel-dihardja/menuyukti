# Build and push gentic-agents image (menuyukti-agents). Independent of graphql/web.
#
# Manual run: Actions → this workflow → "Run workflow" (optional tag input).
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD (see docker-build-push.reusable.yml)
# Optional variable: DOCKER_IMAGE_PREFIX (default johngoyason)

name: Docker — gentic-agents

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional single tag (empty = sha-* + latest on default branch)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
      - gentic # integration branch for image builds — use `develop` here instead if you switch back
    paths:
      - "apps/gentic-agents/**"
      - "packages/gentic/**"

jobs:
  build-push:
    uses: ./.github/workflows/docker-build-push.reusable.yml
    secrets: inherit
    with:
      service: agents
      dockerfile: apps/gentic-agents/Dockerfile
      image_repository: ${{ format('{0}/menuyukti-agents', vars.DOCKER_IMAGE_PREFIX != '' && vars.DOCKER_IMAGE_PREFIX || 'johngoyason') }}
      custom_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
