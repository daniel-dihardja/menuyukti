name: MVP Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

jobs:
  mvp-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANALYTICS_API_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_DB_FORBIDDEN_PATTERN: "(prod|production)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GraphQL integration tests
        run: |
          uv sync
          make -C apps/graphql test-upload

      - name: Validate DATABASE_URL secret exists
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is required for MVP release gate."
            exit 1
          fi

      - name: Run full MVP E2E release gate
        run: pnpm -C apps/web run test:e2e:full

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: apps/web/e2e-artifacts/
          if-no-files-found: warn
