name: ai-explorer

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL for mission execution"
        required: false
        default: "http://127.0.0.1:3000"
      fail_on_severity:
        description: "Fail job when this severity or higher is present (critical|high|off)"
        required: false
        default: "critical"
  schedule:
    - cron: "0 1 * * *"

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'http://127.0.0.1:3000' }}
      AI_FAIL_ON_SEVERITY: ${{ github.event.inputs.fail_on_severity || 'critical' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C apps/web typecheck

      - name: Start web app
        run: |
          pnpm -C apps/web dev > /tmp/menuyukti-web.log 2>&1 &
          echo $! > /tmp/menuyukti-web.pid
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then
              break
            fi
            sleep 2
          done

      - name: Run AI explorer missions
        run: |
          pnpm -C apps/web run test:e2e:ai:sales
          pnpm -C apps/web run test:e2e:ai:pairs
          pnpm -C apps/web run test:e2e:ai:scheduler
          pnpm -C apps/web run test:e2e:ai:attribution

      - name: Upload AI explorer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-explorer-artifacts
          path: |
            e2e-artifacts/ai-explorer
            /tmp/menuyukti-web.log
          retention-days: 14

      - name: Stop web app
        if: always()
        run: |
          if [ -f /tmp/menuyukti-web.pid ]; then
            kill "$(cat /tmp/menuyukti-web.pid)" || true
          fi
