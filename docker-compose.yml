# Start the stack from the repo root:
#   docker compose up --build
#
# In `.env` next to this file, set:
#   DATABASE_URL   — Neon Postgres URL (web + GraphQL), e.g. postgresql://user:pass@...neon.tech/neondb?sslmode=require
#   OPENAI_API_KEY — for gentic-agents
#   CLERK_SECRET_KEY — Clerk secret key (also passed into the web container via `environment:`)
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY — Clerk publishable key (pk_…); used at `next build` and, for the web
#       container, mapped to env var CLERK_PUBLISHABLE_KEY at runtime (see `web` service `environment:`)
#   GRAPHQL_INTERNAL_API_KEY — optional shared secret; when set, web sends it as X-Internal-Api-Key and graphql
#       requires it (same value as apps/graphql INTERNAL_API_KEY).
#
# The `web` service loads `.env` via `env_file`. Rebuild after changing build-time vars:
#   docker compose build --no-cache web && docker compose up -d web
#
# Initialize or migrate the GraphQL schema against Neon when needed:
#   docker compose run --rm graphql uv run python -m graphql.data_sources.database

name: menuyukti

services:
  graphql:
    image: johngoyason/menuyukti-graphql:latest
    build:
      context: .
      dockerfile: apps/graphql/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${GRAPHQL_INTERNAL_API_KEY:-}
    ports:
      - "8000:8000"

  gentic-agents:
    image: johngoyason/menuyukti-agents:latest
    build:
      context: .
      dockerfile: apps/gentic-agents/Dockerfile
    environment:
      ADDR: :7000
      GRAPHQL_ENDPOINT: http://graphql:8000/graphql
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - graphql
    ports:
      - "7000:7000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    image: johngoyason/menuyukti-web:latest
    env_file:
      - .env
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        ANALYTICS_API_URL: http://graphql:8000
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GRAPHQL_ENDPOINT: http://graphql:8000/graphql
      GRAPHQL_INTERNAL_API_KEY: ${GRAPHQL_INTERNAL_API_KEY:-}
      AGENTS_URL: http://gentic-agents:7000
      ANALYTICS_API_URL: http://graphql:8000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    depends_on:
      graphql:
        condition: service_started
      gentic-agents:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
